services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-
      POSTGRES_DB: arb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arb"]
      interval: 5s
      retries: 10

  scanner:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://arb:${POSTGRES_PASSWORD:-arb}@postgres:5432/arb
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
